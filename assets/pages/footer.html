<footer class="footer eu-ft">
    <!-- mantidos para sites antigos que usam ícones ou a fonte carregados por este arquivo -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap');

      /* sem fundo próprio: herda a cor do texto do site, então funciona em tema claro e escuro */
      footer.eu-ft {
        box-sizing: border-box;
        display: block;
        position: static;
        float: none;
        clear: both;
        width: 100%;
        max-width: none;
        margin: auto 0 0;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        color: inherit;
        font: 400 12px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: normal;
        text-align: left;
        text-transform: none;
        -webkit-font-smoothing: antialiased;
        container-type: inline-size;
      }
      /* neutraliza regras do site em tags e seletores genéricos (div, a, *) */
      footer.eu-ft .eu-ft-in, footer.eu-ft .eu-ft-in * {
        box-sizing: border-box;
        position: static;
        inset: auto;
        float: none;
        transform: none;
        z-index: auto;
        width: auto;
        height: auto;
        min-width: 0;
        min-height: 0;
        max-width: none;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-transform: none;
        text-decoration: none;
        visibility: visible;
      }
      footer.eu-ft .eu-ft-in {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 24px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 24px;
        padding-bottom: max(18px, env(safe-area-inset-bottom));
        border-top: 1px solid rgba(128, 128, 128, .25);
        border-top-color: color-mix(in srgb, currentColor 18%, transparent);
      }
      footer.eu-ft .eu-ft-c { display: block; opacity: .55; white-space: nowrap; }
      footer.eu-ft .eu-ft-in a.eu-ft-a { white-space: nowrap; }
      footer.eu-ft .eu-ft-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
      footer.eu-ft .eu-ft-in a.eu-ft-a {
        display: inline-flex;
        align-items: center;
        padding: 2px 0;
        opacity: .55;
        cursor: pointer;
        transition: opacity .15s;
      }
      footer.eu-ft .eu-ft-in a.eu-ft-a:hover, footer.eu-ft .eu-ft-in a.eu-ft-a:focus-visible { opacity: 1; }
      footer.eu-ft .eu-ft-in a.eu-ft-a:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; border-radius: 2px; }
      footer.eu-ft .eu-ft-in .eu-ft-a svg { display: block; width: 14px; height: 14px; fill: currentColor; }
      /* empilhado e centralizado quando falta espaço: pela largura da tela e, onde houver suporte, pela largura do próprio rodapé */
      @media (max-width: 640px) {
        footer.eu-ft .eu-ft-in { flex-direction: column-reverse; justify-content: center; text-align: center; padding-left: 16px; padding-right: 16px; }
        footer.eu-ft .eu-ft-nav { justify-content: center; }
        footer.eu-ft .eu-ft-c { white-space: normal; }
      }
      @container (max-width: 640px) {
        footer.eu-ft .eu-ft-in { flex-direction: column-reverse; justify-content: center; text-align: center; padding-left: 16px; padding-right: 16px; }
        footer.eu-ft .eu-ft-nav { justify-content: center; }
        footer.eu-ft .eu-ft-c { white-space: normal; }
      }
    </style>
