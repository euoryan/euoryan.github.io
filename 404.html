<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>euoryan // 404</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);  /* fundo aqui → longfazers ficam acima */
    }

    :root {
      --moss:    hsl(85, 44%, 48%);
      --moss-hi: hsl(85, 44%, 62%);
      --moss-lo: hsl(85, 36%, 32%);
      --bg:      hsl(86, 13%, 7%);
      --border:  hsl(86, 12%, 16%);
      --text:    hsl(85,  8%, 87%);
      --muted:   hsl(85,  8%, 50%);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --moss:    hsl(85, 40%, 34%);
        --moss-hi: hsl(85, 40%, 44%);
        --moss-lo: hsl(85, 36%, 26%);
        --bg:      hsl(85, 18%, 97%);
        --border:  hsl(85, 14%, 86%);
        --text:    hsl(85, 18%, 11%);
        --muted:   hsl(85, 10%, 44%);
      }
      .btn-home { color: #fff !important; }
    }

    /* ═══════════════════════════════
       SPEED LINES — tela cheia
    ═══════════════════════════════ */
    .longfazers {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;           /* acima do fundo do body, abaixo do conteúdo */
      overflow: hidden;
    }
    .longfazers span {
      position: absolute;
      height: 1px;
      background: var(--moss);
      opacity: 0;
    }
    .longfazers span:nth-child(1)  { width: 35%; top:  4%; animation: lf  0.55s linear infinite; animation-delay: -0.1s; }
    .longfazers span:nth-child(2)  { width: 22%; top: 10%; animation: lf2 0.80s linear infinite; animation-delay: -0.6s; }
    .longfazers span:nth-child(3)  { width: 40%; top: 17%; animation: lf3 0.48s linear infinite; animation-delay: -1.2s; }
    .longfazers span:nth-child(4)  { width: 18%; top: 25%; animation: lf  0.70s linear infinite; animation-delay: -3.1s; }
    .longfazers span:nth-child(5)  { width: 30%; top: 33%; animation: lf2 0.62s linear infinite; animation-delay: -0.4s; }
    .longfazers span:nth-child(6)  { width: 45%; top: 42%; animation: lf3 0.52s linear infinite; animation-delay: -2.0s; }
    .longfazers span:nth-child(7)  { width: 25%; top: 50%; animation: lf  0.75s linear infinite; animation-delay: -4.5s; }
    .longfazers span:nth-child(8)  { width: 38%; top: 58%; animation: lf2 0.58s linear infinite; animation-delay: -1.7s; }
    .longfazers span:nth-child(9)  { width: 20%; top: 66%; animation: lf3 0.65s linear infinite; animation-delay: -0.9s; }
    .longfazers span:nth-child(10) { width: 42%; top: 74%; animation: lf  0.50s linear infinite; animation-delay: -3.3s; }
    .longfazers span:nth-child(11) { width: 28%; top: 83%; animation: lf2 0.72s linear infinite; animation-delay: -2.5s; }
    .longfazers span:nth-child(12) { width: 33%; top: 91%; animation: lf3 0.56s linear infinite; animation-delay: -1.1s; }

    @keyframes lf  { 0%{left:110%; opacity:0.18} 70%{opacity:0.14} 100%{left:-60%; opacity:0} }
    @keyframes lf2 { 0%{left:110%; opacity:0.12} 65%{opacity:0.10} 100%{left:-80%; opacity:0} }
    @keyframes lf3 { 0%{left:110%; opacity:0.22} 60%{opacity:0.16} 100%{left:-50%; opacity:0} }

    /* ═══════════════════════════════
       PAGE LAYOUT
    ═══════════════════════════════ */
    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2.5rem;
      padding: 2rem 1.5rem;
      background: transparent;  /* fundo já está no html/body */
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .screen > * { position: relative; z-index: 3; }

    /* ═══════════════════════════════
       SPEEDER (CSS original, #000→var(--moss))
    ═══════════════════════════════ */
    .rider-stage {
      position: relative;
      width: 100%;
      height: 56px;
    }
    .loader {
      position: absolute;
      top: 50%;
      margin-left: -50px;
      left: 50%;
      animation: speeder 0.4s linear infinite;
    }
    .loader > span {
      height: 5px; width: 35px;
      background: var(--moss);
      position: absolute; top: -19px; left: 60px;
      border-radius: 2px 10px 1px 0;
    }
    .base span {
      position: absolute; width: 0; height: 0;
      border-top: 6px solid transparent;
      border-right: 100px solid var(--moss);
      border-bottom: 6px solid transparent;
    }
    .base span:before {
      content: ""; height: 22px; width: 22px;
      border-radius: 50%; background: var(--moss);
      position: absolute; right: -110px; top: -16px;
    }
    .base span:after {
      content: ""; position: absolute; width: 0; height: 0;
      border-top: 0 solid transparent;
      border-right: 55px solid var(--moss);
      border-bottom: 16px solid transparent;
      top: -16px; right: -98px;
    }
    .face {
      position: absolute; height: 12px; width: 20px;
      background: var(--moss); border-radius: 20px 20px 0 0;
      transform: rotate(-40deg); right: -125px; top: -15px;
    }
    .face:after {
      content: ""; height: 12px; width: 12px;
      background: var(--moss); right: 4px; top: 7px;
      position: absolute; transform: rotate(40deg);
      transform-origin: 50% 50%; border-radius: 0 0 0 2px;
    }
    .loader > span > span:nth-child(1),
    .loader > span > span:nth-child(2),
    .loader > span > span:nth-child(3),
    .loader > span > span:nth-child(4) {
      width: 30px; height: 1px; background: var(--moss);
      position: absolute; animation: fazer1 0.2s linear infinite;
    }
    .loader > span > span:nth-child(2) { top: 3px; animation: fazer2 0.4s linear infinite; }
    .loader > span > span:nth-child(3) { top: 1px; animation: fazer3 0.4s linear infinite; animation-delay: -1s; }
    .loader > span > span:nth-child(4) { top: 4px; animation: fazer4 1s   linear infinite; animation-delay: -1s; }

    @keyframes fazer1 { 0%{left:0} 100%{left:-80px;  opacity:0} }
    @keyframes fazer2 { 0%{left:0} 100%{left:-100px; opacity:0} }
    @keyframes fazer3 { 0%{left:0} 100%{left:-50px;  opacity:0} }
    @keyframes fazer4 { 0%{left:0} 100%{left:-150px; opacity:0} }

    @keyframes speeder {
      0%   { transform: translate(2px,  1px)  rotate(0deg);  }
      10%  { transform: translate(-1px,-3px)  rotate(-1deg); }
      20%  { transform: translate(-2px, 0px)  rotate(1deg);  }
      30%  { transform: translate(1px,  2px)  rotate(0deg);  }
      40%  { transform: translate(1px, -1px)  rotate(1deg);  }
      50%  { transform: translate(-1px, 3px)  rotate(-1deg); }
      60%  { transform: translate(-1px, 1px)  rotate(0deg);  }
      70%  { transform: translate(3px,  1px)  rotate(-1deg); }
      80%  { transform: translate(-2px,-1px)  rotate(1deg);  }
      90%  { transform: translate(2px,  1px)  rotate(0deg);  }
      100% { transform: translate(1px, -2px)  rotate(-1deg); }
    }

    /* ═══════════════════════════════
       404 COPY
    ═══════════════════════════════ */
    .copy {
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.5rem;
      max-width: 400px;
    }

    .num {
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--moss);
      text-shadow: 0 0 80px hsla(85,44%,48%,0.22);
      margin-bottom: 0.1rem;
    }

    .headline {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .body-text {
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .path-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--moss-hi);
      background: hsla(85, 44%, 48%, 0.07);
      border: 1px solid hsla(85, 44%, 48%, 0.2);
      border-radius: 0.3rem;
      padding: 0.22rem 0.65rem;
      margin-top: 0.25rem;
      word-break: break-all;
      max-width: 90vw;
    }

    .footnote {
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.5;
      margin-top: 0.15rem;
    }

    /* ── home button ── */
    .btn-home {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.5rem 1.4rem;
      font-size: 0.8125rem; font-family: inherit; font-weight: 500;
      color: hsl(86, 13%, 7%);
      background: var(--moss);
      border: 1px solid var(--moss-lo);
      border-radius: 0.375rem;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
    }
    .btn-home:hover  { background: var(--moss-hi); }
    .btn-home:active { transform: scale(0.97); }

    @media (max-width: 360px) {
      .num { font-size: 5rem; }
      .body-text { font-size: 0.76rem; }
    }
  </style>
</head>
<body>

<!-- speed lines fullscreen -->
<div class="longfazers" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<div class="screen">

  <!-- motociclista -->
  <div class="rider-stage">
    <div class="loader">
      <span><span></span><span></span><span></span><span></span></span>
      <div class="base">
        <span></span>
        <div class="face"></div>
      </div>
    </div>
  </div>

  <!-- copy -->
  <div class="copy">
    <p class="num">404</p>
    <h1 class="headline">Isso é um erro.</h1>
    <p class="body-text">O URL solicitado não foi encontrado neste servidor.</p>
    <code class="path-pill" id="err-path">/</code>
    <p class="footnote">É tudo o que sabemos.</p>
  </div>

  <!-- voltar -->
  <a href="/" class="btn-home">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Ir para o início
  </a>

</div>

<script>
  document.getElementById('err-path').textContent =
    window.location.pathname + window.location.search;
</script>
</body>
</html>
